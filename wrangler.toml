name = "bolita-keeper"
main = "src/worker.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# El keeper mira los precios cada minuto.
[triggers]
crons = ["* * * * *"]

# Memoria del keeper (recuerda qué rejillas existen y hasta qué bloque escaneó).
# Crea el KV en Cloudflare y pega su ID aquí (te guío en el chat).
[[kv_namespaces]]
binding = "KEEPER_KV"
id = "PON_AQUI_EL_ID_DEL_KV"
